<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — Pierrick Rugery</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.7;
      color: #222;
      background: #fff;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 2.5rem 1rem;
    }

    a { color: #1772d0; text-decoration: none; }
    a:hover { color: #f09228; text-decoration: underline; }

    nav {
      font-size: 0.9rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid #e8e8e8;
      padding-bottom: 0.75rem;
    }

    nav .site-name {
      font-weight: 600;
      color: #222;
      margin-right: 1rem;
    }

    footer {
      margin-top: 3rem;
      padding-top: 0.75rem;
      border-top: 1px solid #e8e8e8;
      font-size: 0.82rem;
      color: #888;
      text-align: center;
    }

    footer a { color: #888; }
    footer a:hover { color: #1772d0; }
  </style>
  {% if page.math %}
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] }
    };
  </script>
  <script id="MathJax-script" async
          src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  {% endif %}
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="site-name" href="/">Pierrick Rugery</a>
      <a href="/">Home</a> &nbsp;/&nbsp;
      <a href="/blog/">Blog</a>
    </nav>

    {{ content }}

    <footer>
      <p>
        Template adapted from
        <a href="https://jonbarron.info">Jon Barron's website</a>.
        Last updated May 2026.
      </p>
    </footer>
  </div>
</body>
</html>
