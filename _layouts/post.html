---
layout: default
---

<style>
  .post-header { margin-bottom: 2rem; }
  .post-header h1 { font-size: 1.6rem; font-weight: 700; line-height: 1.3; margin-bottom: 0.4rem; }
  .post-meta { font-size: 0.85rem; color: #888; }
  .post-meta .category { margin-left: 0.75rem; }

  .post-content { color: #333; }
  .post-content h2 { font-size: 1.15rem; font-weight: 600; margin: 1.75rem 0 0.5rem; }
  .post-content h3 { font-size: 1rem; font-weight: 600; margin: 1.4rem 0 0.4rem; }
  .post-content p { margin-bottom: 1rem; }
  .post-content ul, .post-content ol { margin: 0.5rem 0 1rem 1.5rem; }
  .post-content li { margin-bottom: 0.3rem; }
  .post-content blockquote {
    border-left: 3px solid #ddd;
    padding-left: 1rem;
    color: #666;
    margin: 1rem 0;
  }
  .post-content code {
    background: #f5f5f5;
    padding: 0.1em 0.35em;
    border-radius: 3px;
    font-size: 0.88em;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  .post-content pre {
    background: #f5f5f5;
    padding: 1rem;
    border-radius: 4px;
    overflow-x: auto;
    margin-bottom: 1rem;
  }
  .post-content pre code {
    background: none;
    padding: 0;
    font-size: 0.85em;
  }
  .post-content img {
    max-width: 100%;
    border-radius: 4px;
    margin: 0.75rem 0;
  }
  .post-content a { color: #1772d0; }
  .post-content a:hover { color: #f09228; text-decoration: underline; }

  .post-content figure { margin: 1.5rem 0; }
  .post-content figure img,
  .post-content figure video {
    display: block;
    width: 100%;
    border-radius: 4px;
    margin: 0;
  }
  .post-content figure video { background: #000; }
  .post-content figcaption {
    font-size: 0.8rem;
    color: #888;
    margin-top: 0.4rem;
    text-align: center;
  }

  .back-link { margin-top: 2.5rem; font-size: 0.9rem; }
</style>

<article>
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%B %-d, %Y" }}
      </time>
      {% if page.category %}
        <span class="category">· {{ page.category }}</span>
      {% endif %}
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>

<p class="back-link"><a href="/blog/">&larr; All posts</a></p>
